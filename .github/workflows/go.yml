name: Go build and tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
env:
  GOFLAGS: -mod=mod
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.x'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
      - run: go build -o maxio .
      - run: go test ./...
