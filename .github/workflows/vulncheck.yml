name: VulnCheck
on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

permissions:
  contents: read # to fetch code (actions/checkout)

env:
  GOFLAGS: -mod=mod

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: 1.27.x
          cache: false
      - name: Get official govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
        shell: bash
      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" -show verbose ./...
        shell: bash
