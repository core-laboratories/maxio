name: Helm Chart linting

on:
  pull_request:
    branches:
      - master

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@v5.1.0

      - name: Run helm lint
        run: |
          cd helm/maxio
          helm lint .
          helm template maxio . --set mode=standalone --set environment.MAXIO_IPFS_ENABLED=false > /dev/null
          helm template maxio . --set environment.MAXIO_IPFS_ENABLED=false > /dev/null
