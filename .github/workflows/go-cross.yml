name: Cross-platform build
on:
  pull_request:
permissions:
  contents: read
env:
  GOFLAGS: -mod=mod
  CGO_ENABLED: '0'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.x'
          cache: false
      - run: go build -o /tmp/maxio-${{ matrix.goos }}-${{ matrix.goarch }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
