# Settings and configurations that are common for all containers
x-maxio-common: &maxio-common
  image: maxio:local
  command: server --console-address ":9001" http://maxio{1...4}/data{1...2}
  expose:
    - "9000"
    - "9001"
  # environment:
    # MAXIO_ROOT_USER: maxioadmin
    # MAXIO_ROOT_PASSWORD: maxioadmin
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
    interval: 5s
    timeout: 5s
    retries: 5

# starts 4 docker containers running maxio server instances.
# using nginx reverse proxy, load balancing, you can access
# it through port 9000.
services:
  maxio1:
    <<: *maxio-common
    hostname: maxio1
    volumes:
      - data1-1:/data1
      - data1-2:/data2

  maxio2:
    <<: *maxio-common
    hostname: maxio2
    volumes:
      - data2-1:/data1
      - data2-2:/data2

  maxio3:
    <<: *maxio-common
    hostname: maxio3
    volumes:
      - data3-1:/data1
      - data3-2:/data2

  maxio4:
    <<: *maxio-common
    hostname: maxio4
    volumes:
      - data4-1:/data1
      - data4-2:/data2

  nginx:
    image: nginx:1.19.2-alpine
    hostname: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      - maxio1
      - maxio2
      - maxio3
      - maxio4

## By default this config uses default local driver,
## For custom volumes replace with volume driver configuration.
volumes:
  data1-1:
  data1-2:
  data2-1:
  data2-2:
  data3-1:
  data3-2:
  data4-1:
  data4-2:
